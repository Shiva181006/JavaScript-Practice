<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body style="background-color: black; color: white;">

  <h1>To Do List</h1>

  <form >
    <input type="text" id="task" name="task" style="width: 300px; height: 30px; padding: 5px;">
    <button type="submit" style="height: 40px; padding: 5px; font-size: 20px; ">Add</button>
  </form>

  <div class="allTask"></div>

  <script>

    const form = document.querySelector("form")
    const allTask = document.querySelector("#allTask")
    const input = document.querySelector("input")

    form.addEventListener("submit",(e)=>{
      e.preventDefault();

      const text = input.value.trim();

      if(text == ""){
        return ;
      }

      const parent = document.createElement("div")

      const task = document.createElement("span")
      task.textContent = text;

      task.style.marginRight = "20px";

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete"
      deleteButton.style.width ="30px";

      const doneButton = document.createElement("button")
      doneButton.textContent = "Done"
      doneButton.style.width = "30px";

      doneButton.style.marginRight = "10px";
    })
  </script>
</body>
</html>
