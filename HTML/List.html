<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List</title>
</head>
<body>
  <h3>List</h3>
  <h4>Ordered List</h4>
  <h4>UnOrdered List</h4>
  <h4>Descriptive List</h4>

  <!-- Example of Ordered List-->
   <ol start="3 ">
    <li>Milk</li>
    <li>Tea</li>
    <li>Coffee</li>
   </ol>

   <!-- Example of UnOrdered List-->
   <ul>
    <li>Milk</li>
    <li>Tea</li>
    <li>Coffee</li>
   </ul>

   <!-- Example of Descriptive List-->
   <dl>
    <dt>Milk</dt>
    <dd>Milk is the cow milk</dd>
    <dt>Tea</dt>
    <dd>Tea is made up with milk and tea leafs</dd>
    <dt>Coffee</dt>
    <dd>coffee is made up of milk and coffee</dd>
   </dl>
</body>
</html>
