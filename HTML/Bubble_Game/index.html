<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble game</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      .main {       
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: greenyellow;
      }
      .panel {
        overflow: hidden;
        width: 90%;
        height: 90%;
        border-radius: 10px;
        background-color: aqua;
      }
      .ptop{
        padding: 0px 30%;
        justify-content: space-between;
        display: flex;
        align-items: center;
        color: #fff;
        background-color: blue;
        width: 100%;
        height: 100px;
      }

      .elem{
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .elem h2{
        font-weight: 300;
        font-size: 22px;

      }
      .box{
        color: #000;
        font-weight: 700;
        font-size: 25px;
        padding: 10px 20px;
        background-color: #fff;
        border-radius: 5px;
      }
      .pbtm{
        padding: 20px;
        width: 100%;
        height: calc(100% - 100px);

      }
      .bubble{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 60px;
        height: 60px;
        background-color: yellow;
        color: white;
        border-radius: 50%;
      }

      .bubble:hover{
        cursor: pointer;
        background-color: rgb(240, 124, 36);
      }

    </style>
  </head>
  <body>
    <div class="main">
      <div class="panel">
        <div class="ptop">
          <div class="elem">
            <h2>Score</h2>
            <div class="box"></div>
          </div>
          <div class="elem">
            <h2>Score</h2>
            <div class="box"></div>
          </div>
          <div class="elem">
            <h2>Score</h2>
            <div class="box"></div>
          </div>
        </div>
        <div class="pbtm">
          <div class="bubble">5</div>
        </div>
      </div>
    </div>
  </body>
</html>
