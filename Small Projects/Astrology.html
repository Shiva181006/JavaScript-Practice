<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      "
    >
      <h1>Astrology Insights</h1>

      <form
       id="astrology"
        style="
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 0.5rem;
          border: 2px solid black;
          padding: 45px;
          background-color: azure;
        "
      >
        <label for="name">First Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter First Name"
        />

        <label for="lastname">Last Name</label>
        <input
          type="text"
          id="lastname"
          name="lastname"
          placeholder="Enter last Name"
        />

        <label for="day">Date of Birth(Day)</label>
        <input type="number" id="day" name="day" min="1" max="31" />

        <label for="month">Month</label>
        <input type="number" id="month" name="month" min="1" max="12" />

        <label for="year">Year</label>
        <input type="number" id="year" name="year" min="1990" max="2026" />

        <button type="submit">Submit</button>
      </form>
      <div class="result" id="result"></div>
    </div>

      const form = document.getElementById("astrology")
      
      form.addEventListener('submit',(e)=>{
        e.preventDefault();

        const firstName = document.getElementById("name").value;
        const lastName = document.getElementById("lastname").value;
        const day = parseInt(document.getElementById("day").value);
        const month = parseInt(document.getElementById("month").value);
        const year = parseInt(document.getElementById("year").value);
        
        const text = `Hi ${firstName} ${lastName} , your Zodiac Sign is ${zodiacSigns[month-1]} , ${compliments[day-1]} , ${victimCardCompliments[year%20]}, ${recommendations[day-1]}`

        document.getElementById("result").textContent = text;

    </script>
  </body>
</html>
